name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Configuration comes from release-please-config.json and
          # .release-please-manifest.json; no release-type input here.
          token: ${{ secrets.GITHUB_TOKEN }}
